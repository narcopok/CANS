<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play</title>
</head>
<body>
    <div class="chat-box">
    <!-- Chat Header -->
    <div class="chat-header">
        <h4>Live Support</h4>
    </div>
    
    <!-- Chat Messages Body -->
    <div class="chat-body">
        <div class="message incoming">Hello! How can I help you today?</div>
        <div class="message outgoing">Hi, I have a quick question.</div>
    </div>
    
    <!-- Chat Input Footer -->
    <div class="chat-footer">
        <input type="text" placeholder="Type a message..." id="msg-input">
        <button id="send-btn">Send</button>
    </div>
</div>

</body>
</html>
